<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary sticky-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fa-brands fa-facebook"></i> facebook
            </a>
            <div class="d-flex gap-3 text-white">
                <i class="fa-solid fa-house fs-5"></i>
                <i class="fa-solid fa-bell fs-5"></i>
                <i class="fa-solid fa-user fs-5"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid bg-light py-4">
        <div class="row g-4">
            <aside class="col-lg-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold mb-4">Menu</h5>
                        <div class="menu-item"><i class="fa-solid fa-user"></i> Noor Ul Ain</div>
                        <div class="menu-item"><i class="fa-solid fa-user-group"></i> Friends</div>
                        <div class="menu-item"><i class="fa-solid fa-users"></i> Groups</div>
                        <div class="menu-item"><i class="fa-solid fa-store"></i> Marketplace</div>
                        <div class="menu-item"><i class="fa-solid fa-tv"></i> Watch</div>
                    </div>
                </div>
            </aside>

            <main class="col-lg-6">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="d-flex gap-3 align-items-center">
                            <div class="profile-circle">N</div>
                            <input type="text" class="form-control rounded-pill" placeholder="What's on your mind?">
                        </div>
                        <hr>
                        <div class="row text-center">
                            <div class="col text-success">
                                <i class="fa-solid fa-video"></i> Live Video
                            </div>
                            <div class="col text-primary">
                                <i class="fa-solid fa-image"></i> Photo/Video
                            </div>
                            <div class="col text-warning">
                                <i class="fa-solid fa-face-smile"></i> Feeling
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="profile-circle">A</div>
                            <div>
                                <h6 class="mb-0 fw-bold">Alia Khan</h6>
                                <small class="text-secondary">2 hours ago</small>
                            </div>
                        </div>
                        <p>Exploring new places and creating new memories.</p>
                        <div class="post-image">TRAVEL POST</div>
                        <div class="d-flex justify-content-around border-top pt-3 mt-3">
                            <span><i class="fa-regular fa-thumbs-up"></i> Like</span>
                            <span><i class="fa-regular fa-comment"></i> Comment</span>
                            <span><i class="fa-solid fa-share"></i> Share</span>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="col-lg-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold">Contacts</h5>
                        <div class="contact"><span class="online"></span> Sarah Khan</div>
                        <div class="contact"><span class="online"></span> Ali Ahmed</div>
                        <div class="contact"><span class="online"></span> Esha</div>
                        <div class="contact"><span class="online"></span> Jowaid</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
